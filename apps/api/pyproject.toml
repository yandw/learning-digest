# Learning Digest API — Python/FastAPI implementation (round 4, ticket 4.1).
#
# The sole service-layer implementation as of ticket 4.6 (#82): the Node
# reference implementation (lib/, server.js, test/) that this package was
# ported from has been retired. Contracts (contracts/) and their fixtures
# remain the only authority for shapes and error copy; nothing here
# redefines them.
#
# Release versioning (AGENTS.md): the API unit owns its release version
# here since the switchover. 0.2.0 marks the implementation rewrite — the
# Node/FastAPI duality collapses onto Python alone — while the contract
# generation (`/v1`) is unchanged.
[project]
name = "learning-digest-api"
version = "0.2.0"
description = "Learning Digest backend API: /v1 auth, resources, progress, notes, sessions, transcripts, summaries, usage domains (Python/FastAPI; the sole service-layer implementation, ticket 4.6)."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.uv]
# Application, not a distributable library: dependencies resolve from the
# manifest; the `app` package is imported from this directory (pytest
# pythonpath below), so no build backend is needed.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
