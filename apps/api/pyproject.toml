# Learning Digest API — Python/FastAPI implementation (round 4, ticket 4.1).
#
# Coexists with the Node reference implementation in this directory (lib/,
# server.js, test/): the Node side is the porting reference until the final
# round-4 ticket retires it. Contracts (contracts/) and their fixtures are
# the only authority for shapes and error copy; nothing here redefines them.
#
# The release version of the API unit stays authoritative in package.json
# (Node side) for now — the Python switchover happens in a later round-4
# ticket (4.6), which owns the version move. uv requires a version field in
# [project], so this file mirrors the API unit's current version and must
# move in lockstep until 4.6.
[project]
name = "learning-digest-api"
version = "0.1.6"
description = "Learning Digest backend API: /v1 auth + account domain (Python/FastAPI rewrite; coexists with the Node reference)."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[tool.uv]
# Application, not a distributable library: dependencies resolve from the
# manifest; the `app` package is imported from this directory (pytest
# pythonpath below), so no build backend is needed.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
