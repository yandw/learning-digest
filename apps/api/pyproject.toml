# Learning Digest API — Python/FastAPI implementation (round 4, ticket 4.1).
#
# The sole service-layer implementation as of ticket 4.6 (#82): the Node
# reference implementation (lib/, server.js, test/) that this package was
# ported from has been retired. Contracts (contracts/) and their fixtures
# remain the only authority for shapes and error copy; nothing here
# redefines them.
#
# Release versioning (AGENTS.md): the API unit owns its release version
# here since the switchover. 0.2.0 marks the implementation rewrite — the
# Node/FastAPI duality collapses onto Python alone — while the contract
# generation (`/v1`) is unchanged. 0.2.1 (round-4/6 review fixes) delivers
# the AI provider timeout to httpx in seconds not milliseconds and moves
# the four AI-pass routes onto the threadpool (def routes). 0.2.2 (ticket
# 5.5, issue #94) delivers DELETE /v1/resources/{id}: the resource-delete
# cascade (D23) with a one-snapshot batch delete in the store. 0.2.3
# (ticket 5.8, issue #97) adds the config-file layer: apps/api/config.json
# (base values) < env overrides < built-in defaults. 0.2.4 adds a
# route-specific 4 MiB transport cap for long-course caption archives. 0.2.5
# raises that caption-specific cap to 10 MiB. 0.2.6 hardens the usage ledger
# against pre-r4 rows: rows persisted before the rolling-summary / digest /
# explain counters shipped lacked those keys and crashed every record_* call
# (KeyError) — with_defaults() backfills missing fields on read, and the
# next write upgrades the stored row. 0.2.7 merges a resource's
# multi-session transcripts into one timeline for display and the
# course-summary prompt (one copy per range, duplicate gaps folded).
# 0.2.8 fixes that merge's cluster rule: clustering on ANY overlap
# collapsed sliding-window caption chunks (~50% pairwise overlap) into one
# transitive chain, keeping a single record — only near-duplicates (one
# range covering ≥80% of the other's shorter span) may merge now. 0.2.9
# disables qwen3's default thinking phase on every product generation:
# reasoning alone on a long merged transcript exceeded the 120s AI timeout
# (218s observed before the first content token), turning every long-video
# summary into a 502.
[project]
name = "learning-digest-api"
version = "0.2.18"
description = "Learning Digest backend API: /v1 auth, resources, progress, notes, sessions, transcripts, summaries, usage domains (Python/FastAPI; the sole service-layer implementation, ticket 4.6)."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.uv]
# Application, not a distributable library: dependencies resolve from the
# manifest; the `app` package is imported from this directory (pytest
# pythonpath below), so no build backend is needed.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
