# Learning Digest Worker — Python implementation (round 4, ticket 4.5).
#
# The sole service-layer implementation as of ticket 4.6 (#82): the Node
# reference implementation (worker.js, lib/, test/) that this package was
# ported from has been retired. Contracts (contracts/) and their fixtures
# remain the only authority for shapes and error copy; nothing here
# redefines them.
#
# Release versioning (AGENTS.md): the worker unit owns its release version
# here since the switchover. 0.2.0 marks the implementation rewrite — the
# Node/Python duality collapses onto Python alone — while the contract
# generation (`/v1`) is unchanged.
[project]
name = "learning-digest-worker"
version = "0.2.0"
description = "Learning Digest transcription worker: pulls pending tasks from the API (contract-r2 §3.7, D13 pull model), transcribes through a Speech Provider seam (stub or Qwen qwen3-asr-flash), and writes results back. The sole service-layer implementation (ticket 4.6)."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.uv]
# Application, not a distributable library: dependencies resolve from the
# manifest; the `worker` package is imported from this directory (pytest
# pythonpath below), so no build backend is needed.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
