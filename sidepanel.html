<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Learning Digest</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <!-- HEADER -->
    <!-- Note: the panel's own "Learning Digest" title is shown by Chrome's side-panel
         title bar, so we don't repeat a logo here. -->
    <div class="header">
      <div class="header-top">
        <!-- Video info -->
        <div class="video-info" id="videoInfo" style="display: none">
          <div class="video-title" id="videoTitle"></div>
          <div class="video-channel" id="videoChannel"></div>
        </div>
        <div class="header-actions">
          <button
            class="settings-btn"
            id="settingsBtn"
            type="button"
            title="打开 Learning Digest 设置"
            aria-label="打开 Learning Digest 设置"
          >
            设置
          </button>
        </div>
      </div>

      <!-- Tab navigation -->
      <div class="tabs" id="tabsNav" style="display: none">
        <button class="tab active" data-tab="transcript">逐字稿</button>
        <button class="tab" data-tab="overview">概览</button>
        <button class="tab" data-tab="report">纪要</button>
        <button class="tab" data-tab="notes">笔记</button>
      </div>
    </div>

    <!-- MAIN CONTENT -->
    <div class="content" id="contentArea">
      <!-- SESSION CAPTURE (xiaoe-tech Source Platform) -->
      <div id="sessionBar" class="session-bar" style="display: none">
        <div class="session-status" id="sessionStatus"></div>
        <button class="session-btn session-btn-end" id="endLearningBtn" type="button" style="display: none">
          结束学习
        </button>
      </div>
      <div id="sessionView" class="session-view" style="display: none">
        <div class="session-transcript" id="sessionTranscript"></div>
      </div>

      <!-- WELCOME STATE -->
      <div id="welcomeState" class="welcome-container">
        <div class="welcome-icon" aria-hidden="true"></div>
        <div class="welcome-title">Learning Digest</div>
        <div class="welcome-desc">
          在支持的课程平台（首批适配 xiaoe-tech.com）打开一节课，
          点击<strong>浏览器工具栏上的 Learning Digest 图标</strong>：学习会话会自动开始，
          扩展会分段转写课程内容，整理出带时间范围的话题时间轴，并在课程结束时输出完整的学习纪要。
        </div>
      </div>

      <!-- LOADING STATE -->
      <div id="loadingState" style="display: none">
        <div class="loading-container">
          <div class="loading-bar" id="loadingBar">
            <div class="loading-bar-fill" id="loadingBarFill"></div>
          </div>
          <div class="loading-text" id="loadingText">处理中</div>
          <div class="loading-subtext" id="loadingSubtext"></div>
        </div>
      </div>

      <!-- ERROR STATE -->
      <div id="errorState" style="display: none">
        <div class="error-container">
          <div class="error-icon" aria-hidden="true">!</div>
          <div class="error-title" id="errorTitle">出错了</div>
          <div class="error-message" id="errorMessage">
            出现了未知错误。
          </div>
          <button class="error-btn" id="errorBtn">重试</button>
        </div>
      </div>

      <!-- RESULTS -->
      <div id="resultsState" style="display: none">
        <!-- TAB: Transcript (default - no LLM required) -->
        <div class="tab-panel active" data-panel="transcript">
          <div class="section">
            <div class="section-header transcript-section-header">
              <div class="section-title">完整逐字稿</div>
              <div class="transcript-actions">
                <button class="enhance-btn" id="copyTranscriptBtn">复制</button>
                <button class="enhance-btn" id="exportTranscriptBtn">
                  导出
                </button>
              </div>
            </div>
            <!-- Search stays inside the Transcript tab and never changes playback. -->
            <div class="transcript-search" role="search">
              <svg
                class="transcript-search-icon"
                viewBox="0 0 20 20"
                aria-hidden="true"
              >
                <circle cx="8.5" cy="8.5" r="5.5"></circle>
                <path d="m12.5 12.5 4 4"></path>
              </svg>
              <input
                class="transcript-search-input"
                id="transcriptSearchInput"
                type="search"
                placeholder="搜索字词或短语"
                aria-label="搜索逐字稿"
                aria-controls="transcriptList"
                autocomplete="off"
                spellcheck="false"
              />
              <button
                class="transcript-search-clear"
                id="transcriptSearchClearBtn"
                type="button"
                aria-label="清除搜索"
                title="清除搜索"
                hidden
              >
                &times;
              </button>
              <output
                class="transcript-search-count"
                id="transcriptSearchCount"
                aria-live="polite"
              ></output>
              <div
                class="transcript-search-nav"
                role="group"
                aria-label="搜索结果"
              >
                <button
                  id="transcriptSearchPrevBtn"
                  type="button"
                  aria-label="上一个匹配项"
                  title="上一个匹配项（Shift + Enter）"
                  disabled
                >
                  &#8593;
                </button>
                <button
                  id="transcriptSearchNextBtn"
                  type="button"
                  aria-label="下一个匹配项"
                  title="下一个匹配项（Enter）"
                  disabled
                >
                  &#8595;
                </button>
              </div>
            </div>
            <div id="transcriptList"></div>
          </div>
        </div>

        <!-- TAB: Overview (Session Digest view, #31) - renders the end-of-session
             report the 纪要 tab adopts; every timestamp jumps into the transcript -->
        <div class="tab-panel" data-panel="overview">
          <div class="overview-empty" id="overviewEmpty" style="display: block">
            结束一次学习会话后，这里会显示话题与金句。
          </div>
          <div class="section" id="overviewTopicsSection" style="display: none">
            <div class="section-title">话题</div>
            <div id="overviewTopics" class="overview-topics"></div>
          </div>
          <div class="section" id="overviewQuotesSection" style="display: none">
            <div class="section-title">金句</div>
            <div id="overviewQuotes" class="overview-quotes"></div>
          </div>
        </div>

        <!-- TAB: Notes -->
        <div class="tab-panel" data-panel="notes">
          <div class="section">
            <div class="section-header">
              <div class="section-title">已保存的笔记</div>
              <div class="notes-filter">
                <button
                  class="enhance-btn active"
                  id="notesFilterThis"
                  aria-pressed="true"
                >
                  本会话
                </button>
                <button
                  class="enhance-btn"
                  id="notesFilterAll"
                  aria-pressed="false"
                >
                  全部笔记
                </button>
              </div>
            </div>
            <p class="notes-intro" id="notesIntro">
              在逐字稿中选中文字，点击浮条上的「笔记」即可保存。
            </p>
            <div id="notesList"></div>
          </div>
        </div>

        <!-- TAB: Report (纪要, #30) - the end-of-session Session Digest -->
        <div class="tab-panel" data-panel="report">
          <div class="section">
            <div class="section-header">
              <div class="section-title">学习纪要</div>
            </div>
            <div class="report-tab-hint" id="reportTabHint" style="display: none"></div>
            <div class="report-tab-actions" id="reportTabActions" style="display: none">
              <button class="enhance-btn" id="reportOpenBtn" type="button">
                在新标签页打开
              </button>
              <button class="enhance-btn" id="reportDownloadHtmlBtn" type="button">
                下载 HTML
              </button>
              <button class="enhance-btn" id="reportDownloadMdBtn" type="button">
                下载 Markdown
              </button>
            </div>
            <div class="report-tab-error" id="reportTabError" style="display: none">
              <div class="report-tab-error-text" id="reportTabErrorText"></div>
              <button class="session-btn" id="reportRetryBtn" type="button">重试</button>
            </div>
            <div id="reportTabBody" class="report-compact-host" style="display: none"></div>
          </div>
        </div>
      </div>
    </div>

    <script src="settings.js"></script>
    <script src="speech-transcription.js"></script>
    <script src="source-platforms.js"></script>
    <script src="report-render.js"></script>
    <script src="sidepanel.js"></script>
  </body>
</html>
